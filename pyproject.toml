[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-research"
version = "0.4.0"
description = "Alpha research, factor diagnostics, and signal artifact tooling for research-workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "market-data-platform>=0.2.0",
  "numpy>=1.23",
  "pandas>=2.0",
  "pandas-ta>=0.3.14b0",
  "pyarrow>=23.0.1",
  "pyyaml>=6.0",
  "scikit-learn>=1.2",
  "xgboost>=1.7",
  "research-dev-metrics",
  "research-contracts",
]

[project.optional-dependencies]
dev = [
  "duckdb>=1.2",
  "pip-audit>=2.7",
  "pytest>=9.0.3",
  "pytest-cov>=5",
  "ruff>=0.8",
  "ty>=0.0.55",
]
qlib = [
  "pyqlib>=0.9.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["alpha_research", "alpha_research.*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".venv",
  "artifacts",
  "build",
  "dist",
  "outputs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RET", "SIM", "RUF", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 14

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["alpha_research", "market_data_platform"]

[tool.ty.src]
include = ["src", "scripts", "tests"]
exclude = [
  ".venv",
  "artifacts",
  "build",
  "dist",
  "outputs",
]

[tool.coverage.run]
source = ["src/alpha_research"]

[tool.coverage.report]
show_missing = true

[tool.uv.sources]
market-data-platform = { git = "https://github.com/runchengxie/market-data-platform.git", rev = "42d1d8045cf9fbfeda9be1178dacda8549df1132" }
research-contracts = { git = "https://github.com/runchengxie/research-workspace.git", subdirectory = "src/research_contracts", rev = "f28e97008b7c540730720aac82e63a2944a89b58" }
research-dev-metrics = { git = "https://github.com/runchengxie/research-dev-metrics.git", rev = "e1d6e278b0645a23adb523ada9fa8d4743c2e3bf" }

[tool.uv]
# pyqlib 0.9.7 在 Python <3.14 下钉死 mlflow==1.27.0，该版本有多个已知安全漏洞。
# alpha_research 的 qlib 后端只使用 qlib 的数据预处理与 XGBModel 训练，
# 不经过 mlflow workflow recorder，因此用 override 强制解析到已修复版本。
override-dependencies = [
  "mlflow>=2.20.0",
  "cryptography>=50.0.0",
]
