[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-research"
version = "0.1.0"
description = "Alpha research, factor diagnostics, and signal artifact tooling for research-workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "market-data-platform>=0.1.0",
  "numpy>=1.23",
  "pandas>=2.0",
  "pandas-ta>=0.3.14b0",
  "pyarrow>=23.0.1",
  "pyyaml>=6.0",
  "scikit-learn>=1.2",
  "xgboost>=1.7",
]

[project.optional-dependencies]
qlib = [
  "mlflow>=2,<4",
  "pandas>=2.2,<3",
  "pyqlib>=0.9.7",
]
dev = [
  "basedpyright>=1.39.9",
  "pytest>=9.0.3",
  "ruff>=0.8",
  "ty>=0.0.55",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cstree", "cstree.alpha*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".venv",
  "artifacts",
  "build",
  "dist",
  "outputs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RET", "SIM", "RUF", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ty.src]
include = [
  "src/cstree/__init__.py",
  "src/cstree/alpha/backends",
  "src/cstree/alpha/backend_comparison.py",
  "src/cstree/alpha/promotion_gate_flatten.py",
  "src/cstree/alpha/research_artifacts.py",
  "src/cstree/alpha/tuning_service.py",
]
exclude = [
  ".venv",
  "artifacts",
  "build",
  "dist",
  "outputs",
]

[tool.uv.sources]
market-data-platform = { path = "../market-data-platform", editable = true }

[tool.basedpyright]
include = [
  "src/cstree/__init__.py",
  "src/cstree/alpha/cpcv_audit.py",
  "src/cstree/alpha/backends",
  "src/cstree/alpha/backend_comparison.py",
  "src/cstree/alpha/dataset_sampling.py",
  "src/cstree/alpha/dataset_sampling_core.py",
  "src/cstree/alpha/dynamic_signal_ensemble_types.py",
  "src/cstree/alpha/evaluation.py",
  "src/cstree/alpha/feature_windows.py",
  "src/cstree/alpha/modeling_dataset.py",
  "src/cstree/alpha/period_evaluation.py",
  "src/cstree/alpha/promotion_gate_thresholds.py",
  "src/cstree/alpha/promotion_gate_flatten.py",
  "src/cstree/alpha/research_artifacts.py",
  "src/cstree/alpha/signal_artifact.py",
  "src/cstree/alpha/train_eval.py",
  "src/cstree/alpha/train_eval_contracts.py",
  "src/cstree/alpha/train_eval_request_builder.py",
  "src/cstree/alpha/train_eval_result.py",
  "src/cstree/alpha/tuning_service.py",
  "src/cstree/alpha/walk_forward_windows.py",
]
exclude = [
  ".venv",
  "artifacts",
  "build",
  "dist",
  "outputs",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
