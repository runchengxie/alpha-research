[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-research"
version = "0.4.0"
description = "Alpha research, factor diagnostics, and signal artifact tooling for research-workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "market-data-platform>=0.2.0",
  "numpy>=1.23",
  "pandas>=2.0",
  "pandas-ta>=0.3.14b0",
  "pyarrow>=23.0.1",
  "pyyaml>=6.0",
  "scikit-learn>=1.2",
  "xgboost>=1.7",
  "research-dev-metrics",
]

[project.optional-dependencies]
dev = [
  "duckdb>=1.2",
  "pytest>=9.0.3",
  "ruff>=0.8",
  "ty>=0.0.55",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["alpha_research", "alpha_research.*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".venv",
  "artifacts",
  "build",
  "dist",
  "outputs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RET", "SIM", "RUF", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 14

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["alpha_research", "market_data_platform"]

[tool.ty.src]
include = [
  "src/alpha_research/cpcv_audit.py",
  "src/alpha_research/backends",
  "src/alpha_research/dataset_sampling.py",
  "src/alpha_research/dataset_sampling_core.py",
  "src/alpha_research/daily_watch20_minute_features.py",
  "src/alpha_research/daily_watch20_features.py",
  "src/alpha_research/daily_watch20_oos.py",
  "src/alpha_research/daily_watch20_policy.py",
  "src/alpha_research/dynamic_signal_ensemble_types.py",
  "src/alpha_research/evaluation.py",
  "src/alpha_research/feature_windows.py",
  "src/alpha_research/modeling_dataset.py",
  "src/alpha_research/period_evaluation.py",
  "src/alpha_research/promotion_gate_thresholds.py",
  "src/alpha_research/signal_artifact.py",
  "src/alpha_research/style_replica/factors.py",
  "src/alpha_research/train_eval.py",
  "src/alpha_research/train_eval_contracts.py",
  "src/alpha_research/train_eval_request_builder.py",
  "src/alpha_research/train_eval_result.py",
  "src/alpha_research/walk_forward_windows.py",
]
exclude = [
  ".venv",
  "artifacts",
  "build",
  "dist",
  "outputs",
]

[tool.uv.sources]
market-data-platform = { git = "https://github.com/runchengxie/market-data-platform.git", rev = "f98e43e4673d1521fc600c897cfc4dd2c51bb75c" }
research-dev-metrics = { git = "https://github.com/runchengxie/research-dev-metrics.git", rev = "e1d6e278b0645a23adb523ada9fa8d4743c2e3bf" }
